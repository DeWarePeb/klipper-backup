#####################################################################
# 	X/Y Stepper Settings
#####################################################################

[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ah
tuning_goal: performance
voltage: 48   
sgt: 1

## X Stepper on Motor1(B Motor rear left)
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0

rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper

# accel_homing previous: endstop_pin: nhk:gpio10
endstop_pin: accel_homing:x
position_min: 0
position_endstop: 350
homing_speed: 60  #Max 100
position_endstop: 350
position_max: 350
# accel_homing previous: homing_retract_dist: 40
homing_retract_dist: 0

[tmc5160 stepper_x]
cs_pin: PE15
spi_software_mosi_pin = PE14
spi_software_miso_pin = PE13
spi_software_sclk_pin = PE12
interpolate: True
# accel_homing previous: diag0_pin: ^!PG1 # use the same pin that was previously the endstop_pin! 
driver_SGT: 1
run_current: 1.75  # 2026-11-13: 1.4 -> 1.6 -> 2.0 (false start triggers + skipped steps) -> 1.75 (~spec 1.77 A RMS)
sense_resistor: 0.075
stealthchop_threshold: 0

[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ah
tuning_goal: performance
voltage: 48   
sgt: 1

## Y Stepper on Motor2 (A Motor rear right)
[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
# accel_homing previous: endstop_pin: PC2
endstop_pin: accel_homing:y
#endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: -5
homing_speed: 60  #Max 100 (was 40)
position_endstop: 350
position_max: 355
#use_sensorless_homing: true
# accel_homing previous: homing_retract_dist: 40
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PE11
spi_software_mosi_pin = PE14
spi_software_miso_pin = PE13
spi_software_sclk_pin = PE12
interpolate: True
# accel_homing previous: diag0_pin: ^!PE10 # use the same pin that was previously the endstop_pin! 
driver_SGT: 1
run_current: 1.75  # 2026-11-13: 1.4 -> 1.6 -> 2.0 (false start triggers + skipped steps) -> 1.75 (~spec 1.77 A RMS)
sense_resistor: 0.075
stealthchop_threshold: 0