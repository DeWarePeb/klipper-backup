##misc macros

[gcode_macro UPDATE_MAINSAIL]
gcode:
  {% set _ = python_file('updater.py') %}
  
[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
  {% set CURRENT_TARGET = printer.extruder.target|float %}
  CHOME
  G91                         ; relative positioning
  G1 Z20                      ; move nozzle upwards
  FRONT                       ; move the toolhead to the front
  {% if EXTRUDER_TEMP != 0 %}
    STATUS_BUSY
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
      M104 S{EXTRUDER_TEMP} ; only heat up if the current extruder is not already hot
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP} ; wait for min extrude temp to reach
  {% endif %}
  STATUS_READY
  M83                         ; set extruder to relative mode
  G1 E10 F300                 ; extrude a little to soften tip
  G1 E-8 F3600                ; quickly retract a small amount to elimate stringing
  G4 P200                     ; pause for a short amount of time
  G1 E-50 F400                ; retract slowly the rest of the way
  G1 E-20 F300
  M400                        ; wait for moves to finish
  M117 Unload Complete!
  STATUS_OFF


[gcode_macro LOAD_FILAMENT]
description: Loads new filament into toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
  {% set CURRENT_TARGET = printer.extruder.target|float %}
  FRONT                       ; move the toolhead to the front
  {% if EXTRUDER_TEMP != 0 %}
    _LOGO_PENDING
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
      M104 S{EXTRUDER_TEMP} ; only heat up if the current extruder is not already hot
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP} ; wait for min extrude temp to reach
  {% endif %}
  STATUS_BUSY
  NOZZLE_LED_ON


[gcode_macro FRONT]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=FRONT
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F6000        
    RESTORE_GCODE_STATE NAME=FRONT
  M83                         ; set extruder to relative mode
  G1 E50 F300                 ; extrude slowlyL
  G1 E50 F300
  M400                        ; wait for moves to finish
  M117 Load Complete!
  STATUS_OFF
  NOZZLE_LED_OFF


[gcode_macro rewinder_test]
gcode:
    {% set tool = params.TOOL | default(0) | int %}   ; This target can be set with the drop-down in Mainsail
    {% set cycles = params.CYCLES | default(5) | int %}   ; This target can be set with the drop-down in Mainsail
    {% set speed = params.SPEED | default(300) | float %}   ; This target can be set with the drop-down in Mainsail
    {% set accel = params.ACCEL | default(300) | float %}   ; This target can be set with the drop-down in Mainsail
    {% set length = params.LENGTH | default(800) | float %}   ; This target can be set with the drop-down in Mainsail

    MMU_SELECT TOOL={tool}
    MMU_PRELOAD
    MMU_TEST_LOAD LENGTH=50
    {% for n in range(cycles) %}

        MMU_SERVO POS=DOWN
        MMU_TEST_MOVE SPEED={speed} ACCEL={accel} MOVE={length}
        MMU_SERVO POS=UP
# to stop a macro mid-cycle you must use the e-stop.  This dwell allows you to hit the e-stop while the servo is up so that you can pull the filament out of the ERCF while the printer/macro is stopped
        MMU_SERVO POS=DOWN
        MMU_TEST_MOVE SPEED={speed} ACCEL={accel} MOVE=-{length}
        MMU_SERVO POS=UP

    {% endfor %}

    MMU_UNLOAD



