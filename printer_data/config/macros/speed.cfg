[auto_speed]
#axis: diag_x, diag_y  ; One or multiple of `x`, `y`, `diag_x`, `diag_y`, `z`

#margin: 20            ; How far away from your axes to perform movements

#settling_home: 1      ; Perform settling home before starting Auto Speed
#max_missed: 1.0       ; Maximum full steps that can be missed
#endstop_samples: 3    ; How many endstop samples to take for endstop variance

#accel_min: 1000.0     ; Minimum acceleration test may try
#accel_max: 50000.0    ; Maximum acceleration test may try
#accel_accu: 0.05      ; Keep binary searching until the result is within this percentage

#velocity_min: 50.0    ; Minimum velocity test may try
#velocity_max: 5000.0  ; Maximum velocity test may try
#velocity_accu: 0.05   ; Keep binary searching until the result is within this percentage

#derate: 0.8           ; Derate discovered results by this amount

#validate_margin: Unset      ; Margin for VALIDATE, Defaults to margin
#validate_inner_margin: 20.0 ; Margin for VALIDATE inner pattern
#validate_iterations: 50     ; Perform VALIDATE pattern this many times

#results_dir: ~/printer_data/config ; Destination directory for graphs

[gcode_macro SMART_HEATSOAK]
variable_seconds_per_loop: 8
variable_minutes: 30
variable_chamber_temp: 70
variable_bed_temp: 100
variable_fan_speed: 50
gcode:
    G90

    # Homing check
    {% if printer.toolhead.homed_axes == "xyz" %}
        M118 Printer is already homed
    {% else %}
        M118 Printer needs homed...
        G28
    {% endif %}

    {% set seconds_per_loop = params.SECONDS_PER_LOOP|default(variable_seconds_per_loop)|float %}
    {% set total_minutes = params.MINUTES|default(variable_minutes)|float %}
    {% set chamber_temp = params.CHAMBER_TEMP|default(variable_chamber_temp)|float %}
    {% set bed_temp = params.BED_TEMP|default(variable_bed_temp)|float %}
    {% set fan_speed = params.FAN_SPEED|default(variable_fan_speed)|int %}
    
    {% set max_x = printer.toolhead.axis_maximum.x|float - 10 %}
    {% set max_y = printer.toolhead.axis_maximum.y|float - 10 %}
    
    {% if max_x < max_y %}
        {% set diameter = max_x %}
    {% else %}
        {% set diameter = max_y %}
    {% endif %}
    
    {% set radius = diameter / 2 %}
    {% set center_x = printer.toolhead.axis_maximum.x / 2 %}
    {% set center_y = printer.toolhead.axis_maximum.y / 2 %}
    {% set start_x = center_x + radius %}
    {% set start_y = center_y %}
    {% set I = center_x - start_x %}
    {% set J = center_y - start_y %}
    
    {% set loops = (total_minutes * 60 / seconds_per_loop)|int %}
    
    {% set fan_speed_255 = (fan_speed * 255 / 100)|int %}

    # Raise Z to half max height
    G0 Z{printer.toolhead.axis_maximum.z / 2} F1200
    
    # Set bed and chamber temps (no wait)
    M140 S{bed_temp}  
    SET_HEATER_TEMPERATURE HEATER=Chamber_temperature TARGET={chamber_temp}
    
    # Wait for bed temp before turning fan on
    M190 S{bed_temp}
    
    # Turn on fan after bed temp reached
    M106 S{fan_speed_255}

    {% for i in range(loops) %}
        # Maintain temps and fan during loop
        M140 S{bed_temp}
        M117 Start!
        SET_HEATER_TEMPERATURE HEATER=Chamber_temperature TARGET={chamber_temp}
        M106 S{fan_speed_255}

        # Move to start position
        G0 X{start_x} Y{start_y} Z{printer.toolhead.axis_maximum.z / 2} F12000
    
        {% set circumference = 2 * 3.14159265 * radius %}
        {% set feedrate = (circumference / seconds_per_loop) * 60 %}
    
        # Circular move
        G2 X{start_x} Y{start_y} I{I} J{J} F{feedrate|int}
    {% endfor %}
    
    M118 Heat soaking cycle complete.
    M106 S0  ; Turn fan off
    G28 Z